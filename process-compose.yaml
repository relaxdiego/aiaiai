# Supervises the backend: Postgres (LiteLLM's key and spend store), SearXNG
# (web search), and the LiteLLM gateway, which waits for both to be healthy.
#
# Started by `make start` (background) or `make serve` (foreground). Values like
# ${LITELLM_HOST} come from .envrc.local, which scripts/serve.sh loads.
version: "0.5"

# All process output is captured to one file with hard-bounded rotation, so logs
# can never grow unbounded: rotate at 10 MB, keep 3 gzip'd backups, drop >7 days.
# Upper bound ≈ 10 MB + 3 compressed backups. ./logs is git-ignored.
log_location: ./logs/process-compose.log
log_configuration:
  rotation:
    max_size_mb: 10
    max_age_days: 7
    max_backups: 3
    compress: true

processes:
  postgres:
    command: "postgres -D data/postgres -h 127.0.0.1 -p 5439 -c unix_socket_directories=''"
    readiness_probe:
      exec:
        command: "pg_isready -h 127.0.0.1 -p 5439"
      initial_delay_seconds: 1
      period_seconds: 2
      failure_threshold: 30
    shutdown:
      signal: 2
    availability:
      restart: on_failure
      max_restarts: 5

  searxng:
    # Secret comes from $SEARXNG_SECRET, which overrides server.secret_key.
    command: searxng-run
    environment:
      - "SEARXNG_SETTINGS_PATH=searxng/settings.yml"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8888
        path: /healthz
      initial_delay_seconds: 2
      period_seconds: 5
      failure_threshold: 10
    availability:
      restart: on_failure
      max_restarts: 5

  litellm:
    command: ".venv/bin/litellm --config litellm/config.yaml --host ${LITELLM_HOST} --port 4000"
    environment:
      - "DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD}@127.0.0.1:5439/litellm"
      - "SEARXNG_API_BASE=http://127.0.0.1:8888"
      # Keep LiteLLM on the data bundled in the pinned wheel instead of
      # fetching it from GitHub main at runtime.
      - "LITELLM_LOCAL_MODEL_COST_MAP=True"
      - "LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS=True"
      - "LITELLM_LOCAL_BLOG_POSTS=True"
      - "LITELLM_LOCAL_POLICY_TEMPLATES=true"
    depends_on:
      postgres:
        condition: process_healthy
      searxng:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: ${LITELLM_HOST}
        port: 4000
        path: /health/liveliness
      initial_delay_seconds: 5
      period_seconds: 10
      failure_threshold: 30
    availability:
      restart: on_failure
      max_restarts: 5
